---
layout: default
---
<article class="post">
  <p class="post__meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d.%m.%Y" }}</time></p>
  <h1>{{ page.title }}</h1>
  {{ content }}
</article>
<nav class="post__nav" aria-label="Другие записи">
  {% if page.previous %}<a href="{{ page.previous.url | relative_url }}">← {{ page.previous.title }}</a>{% endif %}
  {% if page.next %}<a href="{{ page.next.url | relative_url }}">{{ page.next.title }} →</a>{% endif %}
</nav>
<p class="post__meta"><a href="{{ '/blog/' | relative_url }}">Все записи</a> · <a href="{{ '/blog/feed.xml' | relative_url }}">RSS</a></p>
