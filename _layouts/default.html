<!doctype html>
<html lang="{{ site.lang | default: 'ru' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  {% seo title=false %}
  {% feed_meta %}
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="32x32">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="header">
    <div class="container">
      {% include nav.html %}
    </div>
  </header>
  <main class="container content">
    {{ content }}
  </main>
  <footer class="footer">
    <div class="container">
      © {{ site.time | date: "%Y" }} {{ site.title }}
    </div>
  </footer>
  {% include analytics.html %}
</body>
</html>
